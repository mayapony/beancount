name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 钉住 JDK 17：ubuntu-latest 镜像默认 JDK 已升到 25，而项目用的
      # Gradle 8.3 读不了 Java 25 的 class 文件（major version 69），
      # 会以「BUG! exception in phase 'semantic analysis'」直接失败。
      - name: 固定 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析（零告警）
        run: flutter analyze

      - name: 单元与 Widget 测试
        # 截图工具依赖宿主字体、会写 docs/，不在 CI 跑（见 dart_test.yaml）
        run: flutter test --exclude-tags screenshots

      # 打包会走 manifest / 资源 / 插件配置：平台配置被改坏时在这里就红，
      # 不必等到手动发版才发现。用 debug 构建，快且足够验证配置。
      - name: 构建 APK（校验平台配置）
        run: flutter build apk --debug

      - name: 校验 OpenSpec 规范
        run: |
          npm install -g @fission-ai/openspec
          openspec validate --all --strict
