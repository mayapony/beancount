plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// 发布签名：有 android/key.properties 就用它，没有就回退 debug 签名（本地开发/出包不受影响）。
// key.properties 与 keystore 绝不入库（见 .gitignore 与 RELEASING.md）。
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
            .findAll { !keystoreProperties[it] }
    if (!missing.isEmpty()) {
        throw new GradleException(
                "android/key.properties 缺少字段：${missing.join(', ')}；写法见 RELEASING.md")
    }
}

android {
    namespace = "com.jindou.bean_count"
    // flutter_secure_storage 10.x 编译到 SDK 36（向后兼容）
    compileSdk = Math.max(flutter.compileSdkVersion, 36)
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.jindou.bean_count"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // flutter_secure_storage 10.x 要求 minSdk 23（Keystore 的 AES-GCM）
        minSdk = Math.max(flutter.minSdkVersion, 23)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                // storeFile 相对于 android/app/ 解析，例如 ../release-keystore.jks
                // 指到 android/release-keystore.jks
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // 配了 key.properties 用发布签名；没配回退 debug，避免本地 `flutter run --release` 挂掉。
            // 发布流水线会校验产物不是 debug 签名（见 .github/workflows/release.yml）。
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
